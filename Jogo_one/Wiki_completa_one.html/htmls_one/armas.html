<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Armas do Jogo - Wiki</title>
    <!-- CSS Base Global + CSS Específico de Armas -->
    <link rel="stylesheet" href="../wiki_one_home.css">
    <link rel="stylesheet" href="../csss_one/armas.css">
</head>
<body>

    <header class="cabecalho">
        <a href="../wiki_one_home.html" class="back-button">← Voltar</a>
        <h1>ARMAS</h1>
        <button id="theme-toggle" class="theme-toggle">🌙</button>
        <div class="menu-icone">
            <span class="linha"></span>
            <span class="linha"></span>
            <span class="linha"></span>
        </div>
    </header>

    <main class="weapons-container">

        <!-- CATEGORIA 1: ARMAS MÁGICAS -->
        <section class="weapon-category">
            <h2 class="category-title">Armas Mágicas</h2>
            
            <div class="category-box">
                <!-- SUBCATEGORIA 1 -->
                <div class="subcategory-header">Armas Mágicas de Início de Jogo</div>
                <div class="items-grid">
                    <a href="#" class="item-card">
                        <img src="../../../imagem_site/Images/Game_one/bosses_imagens/Aquela_mãe.jpg" alt="Pistola Mágica">
                        <span>Pistola Mágica</span>
                    </a>
                    <a href="#" class="item-card">
                        <img src="../../../imagem_site/Images/Game_one/bosses_imagens/Doutor_do_reino.jpg" alt="Arma Espacial">
                        <span>Arma Espacial</span>
                    </a>
                    <a href="#" class="item-card">
                        <img src="../../../imagem_site/Images/Game_one/bosses_imagens/Irmãos_Colapso.jpg" alt="Arma de Abelha">
                        <span>Arma de Abelha</span>
                    </a>
                </div>

                <!-- SUBCATEGORIA 2 -->
                <div class="subcategory-header">Armas Mágicas Avançadas</div>
                <div class="items-grid">
                    <a href="#" class="item-card">
                        <img src="../../../imagem_site/Images/Game_one/bosses_imagens/Mãe_Lunar.png" alt="Rifle Laser">
                        <span>Rifle Laser</span>
                    </a>
                    <a href="#" class="item-card">
                        <img src="../../../imagem_site/Images/Game_one/bosses_imagens/Pai_Solar.jpg" alt="Lança-Folhas">
                        <span>Lança-Folhas</span>
                    </a>
                    <a href="#" class="item-card">
                        <img src="../../../imagem_site/Images/Game_one/bosses_imagens/Rei_caido.jpg" alt="Canhão Arco-Íris">
                        <span>Canhão Arco-Íris</span>
                    </a>
                </div>
            </div>
        </section>

        <!-- CATEGORIA 2: LIVROS DE FEITIÇO -->
        <section class="weapon-category">
            <h2 class="category-title">Livros de Feitiço</h2>

            <div class="category-box">
                <!-- SUBCATEGORIA 1 -->
                <div class="subcategory-header">Livros Básicos</div>
                <div class="items-grid">
                    <a href="#" class="item-card">
                        <img src="../../../imagem_site/Images/Game_one/bosses_imagens/Quimera_sedenta.jpg" alt="Feitiço d'Água">
                        <span>Feitiço d'Água</span>
                    </a>
                    <a href="#" class="item-card">
                        <img src="../../../imagem_site/Images/Game_one/bosses_imagens/Rei_dos_corvos.jpg" alt="Livro de Crânios">
                        <span>Livro de Crânios</span>
                    </a>
                </div>

                <!-- SUBCATEGORIA 2 -->
                <div class="subcategory-header">Livros Avançados</div>
                <div class="items-grid">
                    <a href="#" class="item-card">
                        <img src="../../../imagem_site/Images/Game_one/bosses_imagens/Sentinela_dos_mares.jpg" alt="Chamas Malditas">
                        <span>Chamas Malditas</span>
                    </a>
                    <a href="#" class="item-card">
                        <img src="../../../imagem_site/Images/Game_one/bosses_imagens/Terror_dos_mares.jpg" alt="Chuva de Cristal">
                        <span>Chuva de Cristal</span>
                    </a>
                </div>
            </div>
        </section>

    </main>

    <!-- JS Base Global + JS Específico de Armas -->
    <script src="../wiki_one_home.js"></script>
    <script src="../jss_one/armas.js"></script>
</body>
</html>
